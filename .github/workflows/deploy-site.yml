name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # I CSV pubblicati non stanno nel repository: li ricostruisce build_site
      # dalle partizioni gold dentro questo workflow. Senza questi percorsi una
      # correzione ai dati non arrivava sul sito fino alla notte successiva, e
      # sembrava che il deploy non fosse partito.
      - "data/gold/**"
      - "data/stations/**"
      - "scripts/build_site.py"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Senza questo step build_site muore con ModuleNotFoundError: pandas.
      # Il workflow non ha mai installato le dipendenze.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build docs/data dalle partizioni gold
        run: python -m scripts.build_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
