name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # I CSV pubblicati non stanno nel repository: li ricostruisce build_site
      # dalle partizioni gold dentro questo workflow. Senza questi percorsi una
      # correzione ai dati non arrivava sul sito fino alla notte successiva, e
      # sembrava che il deploy non fosse partito.
      - "data/gold/**"
      - "data/stations/**"
      # La cache delle coordinate sta nella cartella stations/ in radice, non in
      # data/stations/: e' un ingresso di build_station_dim come gli altri, e
      # dimenticarla vuol dire correggere una coordinata senza che il sito la
      # veda mai.
      - "stations/**"
      - "scripts/**"
      # config/pipeline.yml decide come vengono classificate le corse, quali
      # misure di ritardo sono valide e dove cadono le classi dell'istogramma:
      # cambiarlo cambia ogni numero pubblicato, e senza questo percorso il sito
      # restava fermo alla versione precedente.
      - "config/**"
      # Una modifica al workflow stesso deve poter essere provata subito.
      - ".github/workflows/deploy-site.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub Pages accetta un deployment alla volta per repository: con due push a
  # pochi minuti di distanza il secondo run parte mentre il primo sta ancora
  # pubblicando e muore con "due to in progress deployment".
  #
  # La prima risposta era `cancel-in-progress: true`, per far vincere il
  # contenuto piu' recente. Non funziona, e il 30 luglio 2026 ha lasciato il sito
  # di test peggio del fallimento stesso: annullare il run vecchio non annulla il
  # deployment che quel run ha GIA' consegnato alle API di Pages, quindi il run
  # nuovo si scontrava comunque. Test e' rimasto con l'app.js nuovo, che chiede
  # copertura_categoria.csv, e il CSV a 404: la dashboard tornava a disegnare le
  # percentuali delle categorie presenti in una giornata sola.
  #
  # Accodarsi invece funziona: il run nuovo attende, e il vecchio finisce solo
  # quando il suo deployment e' andato live. Costa qualche minuto per ogni push
  # in piu' e non lascia mai il sito a meta'.
  #
  # Lo stesso gruppo lo usa daily.yml, che gia' si accoda: due politiche opposte
  # sullo stesso gruppo erano una trappola in attesa. Non e' mai scattata solo
  # perche' i push fatti con GITHUB_TOKEN non innescano workflow, quindi il
  # commit notturno non ha mai generato un Deploy Site capace di annullare la
  # pipeline che lo aveva scritto.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Senza questo step build_site muore con ModuleNotFoundError: pandas.
      # Il workflow non ha mai installato le dipendenze.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build docs/data dalle partizioni gold
        run: python -m scripts.build_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
